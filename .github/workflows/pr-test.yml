name: Draft PR Verification Test Suite

on:
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest discord.py PyNaCl davey

      - name: Check Draft Status and Execute Test Suite
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # Only enforce automated execution path if the PR state is explicitly a draft
          if [ "$IS_DRAFT" = "true" ] || [ "${{ github.event.action }}" = "converted_to_draft" ]; then
            echo "🚀 Draft PR state verified. Running unit test pipelines..."
            pytest test_bot.py -v
          else
            echo "⏭️ Pull Request is not a draft. Skipping suite sequence execution targets."
          fi
