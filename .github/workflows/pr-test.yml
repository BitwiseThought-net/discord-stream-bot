name: PR Verification Test Suite

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Permissions required to let the workflow write check summaries and comment on the PR
permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov discord.py PyNaCl davey

      - name: Execute Test Suite
        run: |
          echo "🚀 Running unit test & coverage pipelines..."
          # Executes pytest and generates the junit.xml and coverage.xml files
          pytest test_bot.py -v

      # 1. Surface individual test results natively in a new "Checks" tab on the PR
      - name: Publish Unit Test Results Check Tab
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Pytest Unit Test Specifications
          path: junit.xml
          reporter: java-junit

      # 2. Extract code coverage percentages and write a summary comment on the PR file changes list
      - name: Publish Code Coverage Markdown Summary
        uses: 5monkeys/cobertura-action@master
        if: success() || failure()
        with:
          path: coverage.xml
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          minimum_coverage: 70
          fail_below_min: false
