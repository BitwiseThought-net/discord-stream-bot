services:
  discord-bot:
    build: .
    container_name: discord_audio_bot
    restart: always
    privileged: true # <-- Required: Grants container authority to detach host kernel modules and read raw USB frames
    devices:
      - /dev/snd:/dev/snd
      - /dev/bus/usb:/dev/bus/usb # <-- Required: Pipes raw hardware USB register pools into the container filesystem
    volumes:
      - /proc/asound:/mnt/asound:ro
      - bot_data:/data
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - COMMAND_BASE=${COMMAND_BASE}
      - RECOVERY_MODE=${RECOVERY_MODE}

volumes:
  bot_data:
