services:
  discord-bot:
    build: .
    container_name: discord_audio_bot
    restart: always
    privileged: true
    network_mode: host
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - COMMAND_BASE=${COMMAND_BASE:-radio}
      - RECOVERY_MODE=${RECOVERY_MODE:-resume}
    volumes:
      - discord_bot_data:/data
      - ./sources:/sources:ro
      - /var/run/docker.sock:/var/run/docker.sock
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
      - "/dev/snd:/dev/snd"

volumes:
  discord_bot_data:
  android_output:
    name: discord_bot_data
